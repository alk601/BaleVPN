name: Copy Releases from Upstream

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source repo (e.g. original-owner/repo-name)'
        required: true
      tag:
        description: 'Specific tag to copy (leave empty to copy ALL releases)'
        required: false

jobs:
  copy-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Copy releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: ${{ github.event.inputs.source_repo }}
          TARGET_REPO: ${{ github.repository }}
          SPECIFIC_TAG: ${{ github.event.inputs.tag }}
        run: |
          # دریافت لیست release ها
          if [ -n "$SPECIFIC_TAG" ]; then
            TAGS="$SPECIFIC_TAG"
          else
            TAGS=$(gh release list -R "$SOURCE_REPO" --limit 100 \
              --json tagName -q '.[].tagName')
          fi

          for TAG in $TAGS; do
            echo "Processing release: $TAG"

            # بررسی اینکه release قبلاً کپی شده یا نه
            if gh release view "$TAG" -R "$TARGET_REPO" &>/dev/null; then
              echo "Release $TAG already exists, skipping..."
              continue
            fi

            # دریافت اطلاعات release
            RELEASE_JSON=$(gh release view "$TAG" -R "$SOURCE_REPO" \
              --json tagName,name,body,isDraft,isPrerelease,assets)

            TITLE=$(echo "$RELEASE_JSON" | jq -r '.name // .tagName')
            BODY=$(echo "$RELEASE_JSON" | jq -r '.body // ""')
            IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r '.isDraft')
            IS_PRE=$(echo "$RELEASE_JSON" | jq -r '.isPrerelease')

            # ساخت پوشه موقت برای asset ها
            mkdir -p /tmp/release-assets

            # دانلود asset ها مستقیم روی runner
            ASSET_COUNT=$(echo "$RELEASE_JSON" | jq '.assets | length')
            echo "Found $ASSET_COUNT assets"

            if [ "$ASSET_COUNT" -gt 0 ]; then
              gh release download "$TAG" -R "$SOURCE_REPO" \
                --dir /tmp/release-assets
            fi

            # ساخت فلگ ها
            FLAGS=""
            [ "$IS_DRAFT" = "true" ] && FLAGS="$FLAGS --draft"
            [ "$IS_PRE" = "true" ] && FLAGS="$FLAGS --prerelease"

            # ساخت release در fork
            echo "$BODY" | gh release create "$TAG" \
              --repo "$TARGET_REPO" \
              --title "$TITLE" \
              --notes-file - \
              $FLAGS \
              /tmp/release-assets/* 2>/dev/null || \
            echo "$BODY" | gh release create "$TAG" \
              --repo "$TARGET_REPO" \
              --title "$TITLE" \
              --notes-file - \
              $FLAGS

            echo "✅ Release $TAG copied successfully"
            rm -rf /tmp/release-assets/*
          done

          echo "🎉 All releases copied!"
